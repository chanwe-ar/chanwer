meta:
  name: Chanwe
  # >>> generated:meta
  # generated by scripts/generate-brand.rb from brandbook/tokens.json: do not edit, run the script.
  # The series order is the hub's plot.categorical (v2, Q3): the accent first,
  # chart-red last, away from primary (dE00 5.0: to the eye one colour).
  chart-palette-order:
    - primary
    - chart-blue
    - chart-teal
    - chart-indigo
    - chart-purple
    - chart-green
    - chart-orange
    - chart-red
  # v2 (brand-v2.md): radii, spacing, control heights and the compact type
  # scale, in CSS px. Typst reads them in pt (x 0.75) from chanwe-tokens.typ.
  v2:
    radius:
      hair: 2px
      row: 8px
      pane: 12px
      surface: 16px
      band: 24px
      pill: 999px
    space:
      "2xs": 4px
      xs: 8px
      sm: 12px
      md: 16px
      lg: 24px
      xl: 32px
      "2xl": 48px
      "3xl": 80px
      section: 120px
    control:
      xs: 28px
      sm: 32px
      md: 40px
      lg: 48px
    type:
      label: 10px
      caption: 11px
      control: 12.5px
      button: 13px
      small: 13px
      body: 14px
      title: 14px
      lead: 15px
      h4: 18px
      h3: 22px
      h2: 28px
      h1: 36px
      display: 48px
    plot:
      focus: "#FD3810"
      slate: ["#232A35", "#475569", "#64748B", "#8A94A6", "#C6CDD6"]
      grid: "#64748B40"
      axis-text: "#64748B"
      title: "#111319"
      grid-width: 1px
      line-width: 2px
      point-size: 3px
      bar-radius: 3px
  # <<< generated:meta
  # Font weights the Typst formats set, by role. Typst cannot read YAML, so
  # each typst-template.typ mirrors them by hand in its token table as
  # `weight-<role>`, the same contract as the palette. They live under
  # `meta` on purpose: `typography.base.weight` would change the HTML format.
  weights:
    hairline: 100     # mono captions and counters at 5–6pt
    thin: 200         # light metadata lines, the copyright micro-line
    body: 300         # running text, serif italics, serif-display numerals
    body-plus: 400    # the figure frame's gloss lines. Was 350 (between
                      # Light and Regular); Satoshi has no 350 cut and Typst
                      # broke the 300/400 tie arbitrarily, so it is Regular.
    regular: 400      # mono metadata, table body, agenda subrows
    medium: 500       # mono labels and eyebrows
    display: 600      # every Schibsted Grotesk run, `strong`
    bold: 700         # mono column headers, definition terms

