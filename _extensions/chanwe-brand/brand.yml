typography:
  # Las cinco familias se declaran `system`, no `file`, a propósito. Con `file`,
  # Quarto embebe cada TTF en el HTML autocontenido tres veces (una por hoja de
  # color), ~38 MB por documento. Los @font-face viven en assets/fonts-web.css,
  # con WOFF2, y entran una sola vez por la lista `css:` del formato HTML.
  # Los formatos Typst leen los TTF del pool compartido, chanwe-report/fonts/.
  #
  # El trío de la marca (CLAUDE.md del ecosistema, 2026-10-01): Satoshi para
  # el texto, Schibsted Grotesk para títulos y display, JetBrains Mono para
  # eyebrows, rótulos y metadatos. Los archivos son los del brandbook
  # (chanwe-brandbook `brand/fonts/`: `web/` para HTML, `print/` para Typst).
  # Inter quedó retirada: no se declara ni se embebe. Las dos serif son las que
  # la guía de marca deja para itálicas y números editoriales en documentos.
  #
  # Schibsted Grotesk: en HTML, el variable del brandbook (400–900, subsets
  # Latin y Latin-Ext). En Typst, cortes estáticos instanciados del variable:
  # Typst lo rechaza ("try installing a static version"). Su eje wght es
  # 400–900, así que no hay ExtraLight ni Light: un pedido de 200 o 300 cae
  # en 400.
  #
  # Satoshi es la fuente de cuerpo desde 2026-10-01. Ocho cortes estáticos:
  # Light 300, Regular 400 + Italic, Medium 500, SemiBold 600, Bold 700 +
  # Italic, Black 900. No hay 100 ni 200: un pedido así cae en Light, y
  # la cursiva liviana cae en la Italic 400. WOFF2 en assets/fonts-web/satoshi/
  # (HTML) y TTF en chanwe-report/fonts/ (Typst).
  fonts:
    - family: Schibsted Grotesk
      source: system
    - family: Satoshi
      source: system
    - family: JetBrains Mono
      source: system
    # Serif editoriales: solo itálicas y numerales.
    - family: Cormorant Garamond
      source: system
    - family: Instrument Serif
      source: system
  base:
    family: Satoshi
    size: 13.5px
    line-height: 1.62

  headings:
    family: Schibsted Grotesk
    weight: 600
    line-height: 1.15
    color: secondary

  link:
    color: primary
    weight: 500

defaults:
  bootstrap:
    defaults:
      # Explicit root. Quarto's default is 17px; the former `root-font-size: 94%`
      # was not a Bootstrap variable and had no effect. 13.5px base renders 14.3px.
      font-size-root: 17px
      body-line-height: 1.62
      btn-font-weight: 600
      # >>> generated:bootstrap
      # generated by scripts/generate-brand.rb from brandbook/tokens.json: do not edit, run the script.
      # v2 shapes for the screen formats: panes 12px (dense) / 16px (surface),
      # every control a pill. `cw-*` are read by assets/chanwe-brand-rules.scss.
      border-radius: 12px
      border-radius-sm: 8px
      border-radius-lg: 16px
      btn-border-radius: 999px
      btn-border-radius-sm: 999px
      btn-border-radius-lg: 999px
      cw-radius-hair: 2px
      cw-radius-row: 8px
      cw-radius-pane: 12px
      cw-radius-surface: 16px
      cw-radius-band: 24px
      cw-radius-pill: 999px
      cw-space-2xs: 4px
      cw-space-xs: 8px
      cw-space-sm: 12px
      cw-space-md: 16px
      cw-space-lg: 24px
      cw-space-xl: 32px
      cw-space-2xl: 48px
      cw-space-3xl: 80px
      cw-space-section: 120px
      cw-control-xs: 28px
      cw-control-sm: 32px
      cw-control-md: 40px
      cw-control-lg: 48px
      cw-text-label: 10px
      cw-text-caption: 11px
      cw-text-control: 12.5px
      cw-text-button: 13px
      cw-text-small: 13px
      cw-text-body: 14px
      cw-text-title: 14px
      cw-text-lead: 15px
      cw-text-h4: 18px
      cw-text-h3: 22px
      cw-text-h2: 28px
      cw-text-h1: 36px
      cw-text-display: 48px
      cw-shadow-rest: "0 1px 2px color-mix(in srgb, #111319 5%, transparent)"
      cw-shadow-lift: "0 1px 2px color-mix(in srgb, #111319 5%, transparent), 0 22px 40px -28px color-mix(in srgb, #111319 35%, transparent)"
      cw-shadow-overlay: "0 24px 64px -24px color-mix(in srgb, #111319 40%, transparent), 0 0 0 1px color-mix(in srgb, #111319 6%, transparent)"
      # <<< generated:bootstrap
      link-decoration: none
      link-hover-decoration: underline
      nav-link-font-weight: 600
      headings-font-weight: 600
      headings-font-family: "Schibsted Grotesk"
      h1-font-size: 2.5rem
      h2-font-size: 2rem
      h3-font-size: 1.6rem
      h4-font-size: 1.22rem
      h5-font-size: 1.05rem
      h6-font-size: 0.92rem

    # The rules layer (`:root` custom properties and every component rule)
    # lives in assets/chanwe-brand-rules.scss, listed in the format's
    # `theme:` after `brand`. Kept out of brand.yml on purpose: Quarto copies
    # the processed brand into one environment variable, and Linux caps a
    # single one at 128 KB (see the header of that file).

  quarto:
    format:
      html:
        title-block-banner: true
        toc: true
        toc-depth: 3
        respect-user-color-scheme: false
        embed-resources: true
