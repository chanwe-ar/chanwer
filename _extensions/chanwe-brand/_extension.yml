title: chanwe-brand
author: Alejandro Abraham
version: 1.1.0
quarto-required: ">=1.8.0"

contributes:
  filters:
    - filters/title-metadata-pills.lua
    - filters/chapter-cover.lua
    - filters/great-quote.lua
    - filters/figure-frame.lua
    - filters/mark-highlight.lua
    - filters/area-heading.lua
    - ../chanwe-report/chanwe-title-dot.lua
  formats:
    html:
      filters:
        - filters/title-metadata-pills.lua
        - filters/chapter-cover.lua
        - filters/great-quote.lua
        - filters/figure-frame.lua
        - filters/mark-highlight.lua
        - filters/area-heading.lua
        - ../chanwe-report/chanwe-title-dot.lua
      title-block-banner: true
      toc: true
      toc-depth: 3
      respect-user-color-scheme: false
      embed-resources: true
      # The brand layer first (it defines the `$brand-*` variables), then the
      # rules that read them. They used to sit in brand.yml; see the header
      # of assets/chanwe-brand-rules.scss for why they moved.
      theme:
        - assets/chanwe-brand-rules.scss
      css:
        - assets/fonts-web.css
        - assets/self-contained-assets.css
      include-after-body:
        - assets/title-banner-layout.html
  metadata:
    project:
      brand: brand.yml
