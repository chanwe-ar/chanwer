title: chanwe-brand
author: Alejandro Abraham
version: 1.1.0
quarto-required: ">=1.8.0"

contributes:
  filters:
    - filters/title-metadata-pills.lua
    - filters/chapter-cover.lua
    - filters/great-quote.lua
    - filters/figure-frame.lua
    - filters/mark-highlight.lua
    - filters/area-heading.lua
  formats:
    html:
      filters:
        - filters/title-metadata-pills.lua
        - filters/chapter-cover.lua
        - filters/great-quote.lua
        - filters/figure-frame.lua
        - filters/mark-highlight.lua
        - filters/area-heading.lua
      title-block-banner: true
      toc: true
      toc-depth: 3
      respect-user-color-scheme: false
      embed-resources: true
      css:
        - assets/self-contained-assets.css
      include-after-body:
        - assets/title-banner-layout.html
    typst:
      highlight-style: none
      toc: true
      toc-depth: 2
      number-sections: true
      papersize: us-letter
      chanwe-assets: "_extensions/chanwe-brand/assets/"
      font-paths:
        - assets/fonts
      filters:
        - filters/typst-brand.lua
      template-partials:
        - typst-template.typ
        - typst-show.typ
  metadata:
    project:
      brand: brand.yml
